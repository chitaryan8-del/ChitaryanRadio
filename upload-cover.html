<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Загрузить обложки</title>
<style>
  :root{ --bg:#0b0b0d; --text:#fff; --hint:#8a8a92; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100%;}
  .wrap{max-width:420px;margin:0 auto;padding:28px 20px 40px;text-align:center;}
  img.logo{width:200px;max-width:70vw;margin-bottom:18px;}
  h1{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin:0 0 4px;}
  p.sub{color:var(--hint);font-size:13px;margin:0 0 28px;}
  .dropzone{border:2px dashed rgba(255,255,255,.25);border-radius:16px;padding:32px 16px;
    cursor:pointer;margin-bottom:18px;}
  .dropzone input{display:none;}
  .dropzone .label{font-size:15px;font-weight:700;}
  .dropzone .hint{color:var(--hint);font-size:12px;margin-top:6px;}
  .queue{text-align:left;margin-bottom:14px;}
  .queue-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#151518;
    border-radius:10px;margin-bottom:8px;font-size:13px;}
  .queue-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .queue-item .state{font-size:16px;flex-shrink:0;}
  .queue-item.done{color:#6ee787;}
  .queue-item.err{color:#ff6b6b;}
  .queue-item.uploading .state{animation:spin 1s linear infinite;display:inline-block;}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  button.upload{width:100%;padding:14px;border:none;border-radius:12px;background:#fff;color:#0b0b0d;
    font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;cursor:pointer;}
  button.upload:disabled{opacity:.4;}
  .status{margin-top:16px;font-size:13px;color:var(--hint);min-height:18px;}
  .status.ok{color:#6ee787;}
  .status.err{color:#ff6b6b;}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="logo.png" alt="">
  <h1>Загрузить обложки</h1>
  <p class="sub">Можно выбрать сразу несколько картинок</p>

  <label class="dropzone" id="dropzone">
    <div class="label">Выбрать картинки</div>
    <div class="hint">Тап — можно выбрать сразу несколько</div>
    <input type="file" id="fileInput" accept="image/*,.jpg,.jpeg,.png,.webp,.gif" multiple>
  </label>

  <div class="queue" id="queue"></div>
  <button class="upload" id="uploadBtn" disabled>Загрузить всё</button>
  <div class="status" id="status"></div>
</div>

<script>
// ЗАПОЛНИ ЭТИ ДВЕ СТРОКИ ДАННЫМИ ИЗ SUPABASE (Project Settings → API)
const SUPABASE_URL = 'https://czqoftvkccivkinttswl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6cW9mdHZrY2NpdmtpbnR0c3dsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5ODQwNDQsImV4cCI6MjEwNTU2MDA0NH0.A1fSOyYv_T8c1tLFncmX-bL90NIbZYDhnL_JvqcGlNM';
const BUCKET = 'tracks';

const fileInput = document.getElementById('fileInput');
const queueEl = document.getElementById('queue');
const uploadBtn = document.getElementById('uploadBtn');
const statusEl = document.getElementById('status');

let queue = [];

fileInput.addEventListener('change', () => {
  queue = Array.from(fileInput.files || []).map(file => ({ file, state: 'pending' }));
  renderQueue();
  uploadBtn.disabled = queue.length === 0;
  statusEl.textContent = '';
  statusEl.className = 'status';
});

function renderQueue(){
  queueEl.innerHTML = '';
  queue.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'queue-item' + (item.state === 'done' ? ' done' : item.state === 'error' ? ' err' : item.state === 'uploading' ? ' uploading' : '');
    const icon = item.state === 'done' ? '✅' : item.state === 'error' ? '⚠️' : item.state === 'uploading' ? '↻' : '⏳';
    row.innerHTML = '<span class="state">' + icon + '</span><span class="name">' + item.file.name + '</span>';
    queueEl.appendChild(row);
  });
}

function sanitizeName(name){
  const dot = name.lastIndexOf('.');
  const base = dot > -1 ? name.slice(0, dot) : name;
  const ext = dot > -1 ? name.slice(dot) : '.jpg';
  const clean = base.replace(/[^a-zA-Zа-яА-Я0-9 _-]/g, '').trim().replace(/\s+/g, '_');
  return Date.now() + '-' + (clean || 'cover') + ext;
}

function uploadOne(file){
  return new Promise((resolve, reject) => {
    const filename = 'covers/' + sanitizeName(file.name);
    const xhr = new XMLHttpRequest();
    xhr.open('PUT', SUPABASE_URL + '/storage/v1/object/' + BUCKET + '/' + filename.split('/').map(encodeURIComponent).join('/'));
    xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
    xhr.setRequestHeader('Content-Type', file.type || 'image/jpeg');
    xhr.setRequestHeader('x-upsert', 'true');
    xhr.onload = () => {
      if(xhr.status >= 200 && xhr.status < 300) resolve();
      else reject(new Error('HTTP ' + xhr.status));
    };
    xhr.onerror = () => reject(new Error('network'));
    xhr.send(file);
  });
}

uploadBtn.addEventListener('click', async () => {
  if(queue.length === 0) return;
  if(SUPABASE_URL.indexOf('ТВОЙ-ПРОЕКТ') > -1){
    statusEl.textContent = 'Сначала впиши данные Supabase в код страницы';
    statusEl.className = 'status err';
    return;
  }
  uploadBtn.disabled = true;
  let okCount = 0, errCount = 0;

  for(let i = 0; i < queue.length; i++){
    queue[i].state = 'uploading';
    renderQueue();
    try{
      await uploadOne(queue[i].file);
      queue[i].state = 'done';
      okCount++;
    }catch(e){
      queue[i].state = 'error';
      errCount++;
    }
    renderQueue();
  }

  if(errCount === 0){
    statusEl.textContent = 'Готово! Загружено: ' + okCount + ' 🎧';
    statusEl.className = 'status ok';
  } else {
    statusEl.textContent = 'Загружено: ' + okCount + ', с ошибкой: ' + errCount;
    statusEl.className = 'status err';
  }
  uploadBtn.disabled = false;
  fileInput.value = '';
});
</script>
</body>
</html>
